services:
  - type: web
    name: neurohorascope-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python start_render.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.17"
      - key: MCP_PUBLIC_DEMO
        value: "true"
      - key: MCP_REQUIRE_AUTH
        value: "false"
      - key: MCP_ACCESS_TOKEN
        sync: false
      - key: MCP_PUBLIC_URL
        sync: false
